<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Web Editor + GitHub Upload</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; gap: 20px; padding: 20px; transition: background 0.3s, color 0.3s; }
    textarea { width: 100%; height: 400px; padding: 10px; }
    .preview { border: 1px solid #ccc; padding: 10px; width: 100%; height: 400px; overflow: auto; background: #fafafa; }
    .tools { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    button { padding: 5px 10px; cursor: pointer; }
    .dark { background: #121212; color: #eee; }
    .dark .preview { background: #1e1e1e; border-color: #333; }
  </style>
</head>
<body>

<div style="flex:1">
  <div class="tools">
    <button onclick="insert('# ')">H1</button>
    <button onclick="insert('## ')">H2</button>
    <button onclick="insert('### ')">H3</button>
    <button onclick="insert('\n\nParagraf baru...\n\n')">Paragraf</button>
    <button onclick="insertImage()">Gambar via URL</button>
    <input type="file" id="imageFile" accept="image/*" onchange="uploadLocalImage()">
    <button onclick="insertLink()">Link</button>
    <button onclick="exportMarkdown()">Export .MD</button>
    <button onclick="uploadToGitHub()">Upload ke GitHub</button>
    <button onclick="toggleDarkMode()">Dark Mode</button>
  </div>
  <textarea id="editor" oninput="renderMarkdown()"></textarea>
</div>

<div class="preview" id="preview"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  function renderMarkdown() {
    const text = document.getElementById('editor').value;
    document.getElementById('preview').innerHTML = marked.parse(text);
  }

  function insert(text) {
    const editor = document.getElementById('editor');
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const before = editor.value.substring(0, start);
    const after = editor.value.substring(end);
    editor.value = before + text + after;
    editor.focus();
    renderMarkdown();
  }

  function insertImage() {
    const url = prompt("Masukkan URL gambar:");
    if (url) insert(`![](${url})\n`);
  }

  function uploadLocalImage() {
    const fileInput = document.getElementById('imageFile');
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      insert(`![](${e.target.result})\n`);
    };
    reader.readAsDataURL(file);
  }

  function insertLink() {
    const url = prompt("Masukkan URL link:");
    const text = prompt("Masukkan teks tampilan link:");
    if (url && text) insert(`[${text}](${url})\n`);
  }

  function exportMarkdown() {
    const text = document.getElementById('editor').value;
    const blob = new Blob([text], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dokumen.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function uploadToGitHub() {
    const token = prompt("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");
    const username = prompt("rafi-sudo");
    const repo = prompt("rafiart");
    const path = prompt("rafiart/generate");
    const commitMessage = prompt("Script buat blog Rafi Art");
    const content = document.getElementById('editor').value;

    if (!token || !username || !repo || !path) {
      alert("Semua kolom wajib diisi!");
      return;
    }

    const encodedContent = btoa(unescape(encodeURIComponent(content)));

    try {
      const getUrl = `https://api.github.com/repos/${rafi-sudo}/${rafiart}/contents/${/generate}`;
      const getResponse = await fetch(getUrl, {
        headers: { Authorization: `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` }
      });
      const getData = getResponse.ok ? await getResponse.json() : {};

      const putResponse = await fetch(getUrl, {
        method: 'PUT',
        headers: {
          Authorization: `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`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: commitMessage || "Update markdown via web editor",
          content: encodedContent,
          sha: getData.sha || undefined
        })
      });

      if (putResponse.ok) {
        alert("✅ File berhasil diupload ke GitHub!");
      } else {
        const err = await putResponse.json();
        alert("❌ Gagal upload:\n" + JSON.stringify(err, null, 2));
      }
    } catch (err) {
      alert("Terjadi error: " + err.message);
    }
  }

  function toggleDarkMode() {
    document.body.classList.toggle('dark');
  }
</script>

</body>
</html>
